<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Thakar Kitchen Inbox</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.svg" />
  <meta name="theme-color" content="#b45309" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app">

    <!-- Login: enter the INBOX_API_KEY once, stored on this device only -->
    <div id="login-screen">
      <div class="login-logo">TK</div>
      <h1>Thakar Kitchen Inbox</h1>
      <p>Enter your access code to continue. You'll only need to do this once on this phone.</p>
      <input id="login-input" type="password" inputmode="text" autocomplete="off" placeholder="Access code" />
      <button id="login-button">Continue</button>
      <div id="login-error" class="login-error hidden">That access code was rejected — check it and try again.</div>
    </div>

    <!-- Main app: hidden until logged in -->
    <div id="main-screen" class="hidden">
      <div class="topbar">
        <button id="back-button" class="icon-btn hidden" aria-label="Back">‹</button>
        <div class="topbar-titles">
          <span id="topbar-title">Tickets</span>
          <span id="topbar-subtitle" class="topbar-subtitle hidden"></span>
        </div>
        <button id="profile-button" class="icon-btn hidden" aria-label="View customer">&#128100;</button>
        <button id="refresh-button" class="icon-btn" aria-label="Refresh">↻</button>
      </div>
      <div id="test-banner" class="test-banner hidden">Test mode: nothing is sent on WhatsApp</div>

      <!-- List view (tickets or chats) -->
      <div id="list-view">
        <div id="ticket-filter" class="filter-row hidden">
          <button data-filter="open" class="active">Needs attention</button>
          <button data-filter="resolved">Resolved</button>
        </div>
        <div id="list-screen" class="screen"></div>
      </div>

      <!-- Thread view (one conversation) -->
      <div id="thread-screen" class="hidden">
        <div id="thread-messages"></div>
        <div id="quick-replies" class="quick-replies"></div>
        <div id="thread-actions" class="thread-actions hidden"></div>
        <div class="composer">
          <textarea id="composer-input" rows="1" placeholder="Type a reply…"></textarea>
          <button id="composer-send" aria-label="Send">Send</button>
        </div>
      </div>

      <!-- Customer profile (CRM) -->
      <div id="profile-screen" class="screen hidden">
        <div id="profile-body"></div>
      </div>

      <!-- Customer-message simulator (test mode only) -->
      <div id="test-screen" class="screen hidden">
        <div id="test-body"></div>
      </div>

      <div class="bottom-nav">
        <button id="nav-tickets" class="active">
          <span class="nav-label">Tickets</span>
          <span id="tickets-count" class="count hidden">0</span>
        </button>
        <button id="nav-chats"><span class="nav-label">Chats</span></button>
        <button id="nav-test" class="hidden"><span class="nav-label">Test</span></button>
      </div>
    </div>

  </div>

  <script src="/app.js"></script>
</body>
</html>
