# Render Blueprint: Render reads this file to create the web service.
# Values marked `sync: false` are secrets; Render asks for them during setup.
services:
  - type: web
    name: thakar-whatsapp-crm
    runtime: node
    # Free while testing (sleeps after 15 min idle, ~1 min to wake). Switch to
    # "starter" before connecting WhatsApp so webhooks are answered instantly.
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Remove (or set to "false") once WhatsApp is connected and you go live.
      - key: TEST_MODE
        value: "true"
      - key: INBOX_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: SHOPIFY_STORE_DOMAIN
        value: esdjn0-th.myshopify.com
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: SHOPIFY_API_VERSION
        value: "2026-07"
      - key: SLA_HOURS
        value: "6"
      - key: CRM_RETURNING_ORDERS
        value: "2"
      - key: CRM_VIP_ORDERS
        value: "5"
      - key: CRM_VIP_SPEND
        value: "5000"
      # AI answers from your website info. Set AI_API_KEY in the Render
      # dashboard (Environment tab) to turn them on; for a non-Claude provider
      # also set AI_PROVIDER=openai and AI_BASE_URL there.
      - key: AI_PROVIDER
        value: anthropic
      - key: AI_MODEL
        value: claude-opus-5
      - key: AI_API_KEY
        sync: false
